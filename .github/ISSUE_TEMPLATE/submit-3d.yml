name: 提交三维复原
description: 提交一个景点的三维复原（含可旋转 glb 或仅三视图渲染）
title: "[三维] "
labels: ["claim", "3d"]
body:
  - type: input
    id: scene
    attributes:
      label: 景点名称
      description: 与待认领列表或 scenes.json 中的写法保持一致
      placeholder: 例如：山高水长
    validations:
      required: true
  - type: dropdown
    id: deliver
    attributes:
      label: 提交形式
      description: 只交渲染图也能收录；含 glb 才会上「旋转查看」
      options:
        - 仅渲染图（三视图 + 主图）
        - 渲染图 + glb 模型（可旋转）
    validations:
      required: true
  - type: dropdown
    id: method
    attributes:
      label: 建模方式
      options:
        - 手工建模
        - 程序化 / 参数化建模
        - 混合（手工 + 程序化）
        - 摄影测量 / 扫描辅助
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: 软件与版本
      description: 例如 Blender 4.2 LTS；若是程序化生成，请一并说明脚本与参数集
      placeholder: Blender 4.2 LTS
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 依据与已知尺寸
      description: 参考图出处、图纸编号、实测或推算的尺度。请写清哪一项来自图档、哪一项是估算
      placeholder: 例如：柱网依样式雷图档 018-7；面阔九间取自《四十景图咏》第十五景；进深与檐高按图估算
    validations:
      required: true
  - type: textarea
    id: uncertainty
    attributes:
      label: 哪些是推断
      description: 逐项列出无法确证的部分（比例、装饰、材质、色彩、植被等）
    validations:
      required: true
  - type: textarea
    id: renders
    attributes:
      label: 渲染图
      description: 上传正立面、侧面、斜俯视与一张主图。请先把文件存到本机再上传，不要粘贴小红书/微博的图片链接
    validations:
      required: true
  - type: input
    id: glb
    attributes:
      label: glb 模型
      description: 可选。附链接，或说明文件体积；建议 ≤10MB，优先不压缩（Draco 解码器在境外 CDN，国内可能加载失败）。没有就填「无」
      placeholder: 例如 6.4MB，Draco 压缩；或 https://…
  - type: textarea
    id: texture
    attributes:
      label: 材质与贴图来源
      description: 使用了哪些贴图，来源是否公有领域或自制。不要使用来源不明的扫描图或网络贴图
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: 署名
      description: 用于贡献者墙的名字或 ID，可附主页链接
    validations:
      required: true
  - type: checkboxes
    id: rules
    attributes:
      label: 提交约定
      options:
        - label: 我确认参考图与贴图可溯源，且为公有领域或获授权
          required: true
        - label: 我同意模型与渲染图以 CC BY-SA 4.0 共享
          required: true
        - label: 我确认未把复原成果宣称为测绘或原貌确证
          required: true
